<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Isekai Online</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1442">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#cfeaff}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(#3a8cf0,#cfeaff 55%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.hud{position:fixed;z-index:5;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
.bar{height:8px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
#hp i{background:#ff5a64}#hg i{background:#ffb22e}#xp i{background:#9b7bff}
#log{position:fixed;z-index:5;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 100px);font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
#joy{position:fixed;z-index:5;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
#acts{position:fixed;z-index:5;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.row{display:flex;gap:6px}
.b{background:rgba(30,25,60,.78);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:9px 10px;font-size:13px;line-height:1.2}
.b:active{background:rgba(124,92,255,.9)}
#grab{font-size:17px;padding:14px 18px;background:rgba(124,92,255,.92)}
#upd{display:none;position:fixed;z-index:15;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);background:#ffb22e;color:#222;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600}
#auth{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1b1442,#5a3fa0);padding:20px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:center}
.card h2{margin:0;font-size:26px}
.card p{margin:0 0 6px;opacity:.8;font-size:14px}
input{font-size:16px;padding:12px;border-radius:12px;border:none;outline:none;-webkit-user-select:text;user-select:text}
#amsg{font-size:13px;min-height:18px;color:#ffd7a8}
/*EXTRA*/
/* ---- diseño horizontal ---- */
.hud{left:calc(env(safe-area-inset-left,0px) + 8px);right:auto;grid-template-columns:repeat(4,112px);gap:8px;font-size:12px}
#log{top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;right:auto;transform:translateX(-50%);width:60%;text-align:center;font-size:12px}
#joy{width:112px;height:112px;left:calc(env(safe-area-inset-left,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#knob{left:26px;top:26px;width:60px;height:60px}
#acts{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);gap:6px}
#out{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);padding:6px 10px;font-size:12px}
#upd{top:auto;bottom:12px}
#auth{overflow-y:auto;touch-action:pan-y}
.card{margin:auto}
@media (max-height:430px){.card{gap:6px}.card h2{font-size:20px}.card p{display:none}input{padding:8px}.b{padding:7px 10px}}
#rot{display:none;position:fixed;z-index:30;inset:0;align-items:center;justify-content:center;background:#1b1442;font-size:20px;text-align:center;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div class="hud">
  <div>❤️ Vida<div class="bar" id="hp"><i></i></div></div>
  <div>🍖 Hambre<div class="bar" id="hg"><i></i></div></div>
  <div>⭐ Nv <span id="lv">1</span><div class="bar" id="xp"><i></i></div></div>
  <div>📅 Día <span id="day">1</span> <span id="tools"></span><br>🪵<b id="wood">0</b> 🪨<b id="stone">0</b> 🫐<b id="food">0</b></div>
</div>
<div id="log"></div>
<div id="rot">🔄 Gira tu teléfono en horizontal para jugar</div>
<div id="upd">🔄 Nueva versión disponible. Toca para actualizar</div>
<div id="joy"><div id="knob"></div></div>
<div id="acts">
  <button class="b" id="out">⚙️ Salir</button>
  <div class="row">
    <button class="b" data-k="axe">🪓<br>3🪵1🪨</button>
    <button class="b" data-k="pick">⛏️<br>3🪵3🪨</button>
    <button class="b" data-k="fire">🔥<br>5🪵2🪨</button>
  </div>
  <button class="b" id="eat">Comer 🫐</button>
  <button class="b" id="grab">✋ Recolectar</button>
</div>
<div id="auth"><div class="card">
  <h2>🌌 Isekai Online</h2>
  <p>Reencarna en otro mundo</p>
  <input id="em" type="email" placeholder="Correo" autocomplete="email">
  <input id="pw" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password">
  <button class="b" id="login">Entrar</button>
  <button class="b" id="signup">Crear cuenta</button>
  <button class="b" id="guest">Jugar sin cuenta</button>
  <div id="amsg"></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const VERSION='0.12.0';
const SB_URL='https://hjyzemewygrornzmmmzx.supabase.co';
const SB_KEY='sb_publishable_DvQhAKfaqMNWJkwDVNEOEQ_khnv0HsQ';
const LS='isekai_guest_v3',CYC=300,R=92;
const $=id=>document.getElementById(id);
let sb=null;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let user=null,S=null,dirty=false,started=false,entering=false;

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newSave(){return{seed:Math.floor(Math.random()*1e9),x:0,z:0,hp:100,hg:100,lv:1,xp:0,wood:0,stone:0,food:0,axe:false,pick:false,t:0,got:[],fires:[]}}
function say(m){$('log').textContent=m}

/* ---------- Three.js ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const cv=renderer.domElement;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
scene.fog=new THREE.Fog(0xe3f5ff,40,140);
const hemi=new THREE.HemisphereLight(0xffffff,0x9cc98a,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2cc,.9);sun.position.set(40,60,20);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

const gm=new THREE.DataTexture(new Uint8Array([100,180,255]),3,1,THREE.LuminanceFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;
const toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});

function H(x,z){
  const d=Math.hypot(x,z),k=Math.min(1,Math.max(0,(d-34)/20));
  return(Math.sin(x*.045)*Math.cos(z*.05)*3.2+Math.sin(x*.12+z*.08)*1.1+Math.cos(z*.1-x*.03)*.8)*k;
}
const tg=new THREE.PlaneGeometry(200,200,90,90);tg.rotateX(-Math.PI/2);
const pos=tg.attributes.position,cols=[];
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),z=pos.getZ(i),h=H(x,z);pos.setY(i,h);
  const c=new THREE.Color();
  if(h<-1.6)c.setHex(0xf3e5b4);else c.setHSL(.27-h*.008,.6,.5+h*.03);
  cols.push(c.r,c.g,c.b);
}
tg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
tg.computeVertexNormals();
scene.add(new THREE.Mesh(tg,new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gm})));
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,400).rotateX(-Math.PI/2),new THREE.MeshToonMaterial({color:0x3fa9ff,transparent:true,opacity:.8,gradientMap:gm}));
water.position.y=-2;scene.add(water);

const geo={trunk:new THREE.CylinderGeometry(.18,.25,1.6,6),leaf:new THREE.ConeGeometry(1.1,2.2,7),rock:new THREE.DodecahedronGeometry(.8,0),bush:new THREE.SphereGeometry(.7,8,6),berry:new THREE.SphereGeometry(.13,6,4)};
const mat={trunk:toon(0x7a4a2a),leaf:toon(0x2f9e57),leaf2:toon(0x57c26b),rock:toon(0x9aa3b5),bush:toon(0x3aa65a),berry:toon(0xc0305a)};
const worldGroup=new THREE.Group();scene.add(worldGroup);
const objs=[];
let fireGroups=[];

function build(seed){
  while(worldGroup.children.length)worldGroup.remove(worldGroup.children[0]);
  objs.length=0;
  const got=new Set(S.got),r=rng(seed);let id=0;
  const place=(type,n)=>{for(let i=0;i<n;i++){
    const x=(r()*2-1)*R,z=(r()*2-1)*R,v=r();id++;
    if(Math.hypot(x,z)<6||H(x,z)<-1.5||got.has(id))continue;
    const g=new THREE.Group();g.position.set(x,H(x,z),z);
    if(type=='T'){
      const t=new THREE.Mesh(geo.trunk,mat.trunk);t.position.y=.8;
      const l=new THREE.Mesh(geo.leaf,v>.5?mat.leaf:mat.leaf2);l.position.y=2.4;
      const l2=new THREE.Mesh(geo.leaf,v>.5?mat.leaf:mat.leaf2);l2.position.y=3.3;l2.scale.setScalar(.7);
      g.add(t,l,l2);g.scale.setScalar(.8+v*.7);
    }else if(type=='R'){
      const m=new THREE.Mesh(geo.rock,mat.rock);m.position.y=.5;m.scale.set(1,.8,1);g.add(m);g.scale.setScalar(.7+v*.8);
    }else{
      const m=new THREE.Mesh(geo.bush,mat.bush);m.position.y=.5;g.add(m);
      for(let k=0;k<3;k++){const b=new THREE.Mesh(geo.berry,mat.berry);const a=k*2.1;b.position.set(Math.cos(a)*.55,.6,Math.sin(a)*.55);g.add(b)}
    }
    g.updateMatrix();g.matrixAutoUpdate=false;
    worldGroup.add(g);objs.push({id,type,x,z,g,got:false});
  }};
  place('T',130);place('R',50);place('B',40);
}
function addFire(f){
  const g=new THREE.Group();
  const c1=new THREE.Mesh(new THREE.ConeGeometry(.45,1.1,6),new THREE.MeshBasicMaterial({color:0xff7a1a}));c1.position.y=.55;
  const c2=new THREE.Mesh(new THREE.ConeGeometry(.25,.7,6),new THREE.MeshBasicMaterial({color:0xffd23f}));c2.position.y=.4;
  g.add(c1,c2);g.position.set(f.x,H(f.x,f.z),f.z);scene.add(g);fireGroups.push(g);
}

/* personaje */
const player=new THREE.Group();
{
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,1,10),toon(0x4a6cf7));body.position.y=.8;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),toon(0xffd9b8));head.position.y=1.65;
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10,0,Math.PI*2,0,Math.PI*.6),toon(0xff7ac6));hair.position.y=1.72;
  const eyeM=new THREE.MeshBasicMaterial({color:0x222244});
  const e1=new THREE.Mesh(new THREE.SphereGeometry(.05,6,6),eyeM);e1.position.set(-.12,1.66,.31);
  const e2=e1.clone();e2.position.x=.12;
  const cape=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,1,8,1,true),toon(0x7c5cff));cape.position.set(0,.8,-.25);cape.material.side=THREE.DoubleSide;
  player.add(body,head,hair,e1,e2,cape);
}

/* cielo y ciclo día/noche */
const cTop=new THREE.Color(),cHor=new THREE.Color(),tmp=new THREE.Color();
function updSky(){
  const ph=(S.t/CYC)%1,k=Math.max(0,Math.min(1,.5+.7*Math.cos(ph*6.2832)));
  cTop.setHex(0x0a1030).lerp(tmp.setHex(0x4aa8ff),k);
  cHor.setHex(0x2b2f5c).lerp(tmp.setHex(0xe3f5ff),k);
  cHor.lerp(tmp.setHex(0xff9a6a),(1-Math.abs(2*k-1))*.45);
  scene.fog.color.copy(cHor);
  hemi.intensity=.32+.75*k;sun.intensity=.1+.85*k;
  document.body.style.background='linear-gradient(#'+cTop.getHexString()+' 0%,#'+cHor.getHexString()+' 55%)';
}

/* ---------- HUD y acciones ---------- */
function hud(){
  const q=(id,v)=>$(id).querySelector('i').style.width=Math.max(0,Math.min(100,v))+'%';
  q('hp',S.hp);q('hg',S.hg);q('xp',S.xp/(S.lv*5)*100);
  $('lv').textContent=S.lv;$('day').textContent=Math.floor(S.t/CYC)+1;
  $('wood').textContent=S.wood;$('stone').textContent=S.stone;$('food').textContent=S.food;
  $('tools').textContent=(S.axe?'🪓':'')+(S.pick?'⛏️':'');
}
function gain(){S.xp++;if(S.xp>=S.lv*5){S.xp=0;S.lv++;S.hp=100;say('[Sistema] ¡Subiste al nivel '+S.lv+'! Vida restaurada.')}}
function nearest(){let b=null,bd=3;for(const o of objs){if(o.got)continue;const d=Math.hypot(o.x-S.x,o.z-S.z);if(d<bd){bd=d;b=o}}return b}
function nearFire(){return S.fires.some(f=>Math.hypot(f.x-S.x,f.z-S.z)<4)}
function die(){say('[Sistema] Has muerto… reencarnando en el punto de inicio.');S.hp=100;S.hg=60;S.x=0;S.z=0;dirty=true}

$('grab').onclick=()=>{
  if(!started)return;
  const o=nearest();if(!o){say('No hay nada cerca para recolectar.');return}
  o.got=true;worldGroup.remove(o.g);S.got.push(o.id);
  if(o.type=='T'){const n=S.axe?2:1;S.wood+=n;say('Recolectaste '+n+' 🪵 madera.')}
  else if(o.type=='R'){const n=S.pick?2:1;S.stone+=n;say('Recolectaste '+n+' 🪨 piedra.')}
  else{S.food+=2;say('Recolectaste 2 🫐 bayas.')}
  gain();hud();dirty=true;
};
$('eat').onclick=()=>{
  if(!started)return;
  if(S.food<1){say('No tienes bayas.');return}
  S.food--;S.hg=Math.min(100,S.hg+25);S.hp=Math.min(100,S.hp+5);say('Comiste 🫐. ¡Mejor!');hud();dirty=true;
};
const COST={axe:[3,1],pick:[3,3],fire:[5,2]};
function craft(k){
  if(!started)return;
  const[w,s]=COST[k];
  if(k=='axe'&&S.axe){say('Ya tienes el hacha.');return}
  if(k=='pick'&&S.pick){say('Ya tienes el pico.');return}
  if(S.wood<w||S.stone<s){say('Te faltan materiales: '+w+' 🪵 y '+s+' 🪨');return}
  S.wood-=w;S.stone-=s;
  if(k=='axe'){S.axe=true;say('[Sistema] Fabricaste 🪓 Hacha: la madera rinde x2.')}
  if(k=='pick'){S.pick=true;say('[Sistema] Fabricaste ⛏️ Pico: la piedra rinde x2.')}
  if(k=='fire'){const f={x:S.x,z:S.z};S.fires.push(f);addFire(f);say('[Sistema] Colocaste una 🔥 Fogata. Cerca de ella no pasas hambre y te curas.')}
  gain();gain();hud();dirty=true;
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>craft(b.dataset.k));

/* ---------- controles ---------- */
let jx=0,jy=0,jid=null;const joy=$('joy'),knob=$('knob');
function jset(e){
  const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy),max=r.width/2-10;if(m>max){dx*=max/m;dy*=max/m}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/max;jy=dy/max;
}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jset(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
let camYaw=0,pitch=.5,cid=null,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{cid=e.pointerId;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==cid)return;camYaw-=(e.clientX-lx)*.006;pitch=Math.max(.2,Math.min(1.1,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>{cid=null});cv.addEventListener('pointercancel',()=>{cid=null});

/* ---------- guardado ---------- */
function cloudErr(e){say('⚠️ No se pudo guardar en la nube: '+(e.message||e))}
async function saveNow(){
  if(!S||!started)return;dirty=false;
  if(!user){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}return}
  if(sb){try{const r=await sb.from('saves').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(r.error)cloudErr(r.error)}catch(e){cloudErr(e)}}
}
setInterval(()=>{if(dirty)saveNow()},8000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

/* ---------- login ---------- */
function startWorld(){
  build(S.seed);S.fires.forEach(addFire);
  player.position.set(S.x,H(S.x,S.z),S.z);scene.add(player);
  hud();updSky();started=true;
  say('[Sistema] Mueve el joystick, arrastra para girar la cámara y toca ✋ para recolectar.');
}
async function enter(u){
  if(entering)return;entering=true;user=u;
  $('amsg').textContent='Cargando partida…';
  let data=null;
  if(user&&sb){
    try{const r=await sb.from('saves').select('data').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;data=r.data&&r.data.data}
    catch(e){$('amsg').textContent='⚠️ '+(e.message||e);entering=false;return}
  }else{try{data=JSON.parse(localStorage.getItem(LS))}catch(e){}}
  S=Object.assign(newSave(),(data&&data.seed)?data:{});
  if(!Array.isArray(S.got))S.got=[];if(!Array.isArray(S.fires))S.fires=[];
  $('auth').style.display='none';
  startWorld();
}
$('login').onclick=async()=>{
  if(!sb){$('amsg').textContent='⚠️ No cargó Supabase. Revisa tu internet.';return}
  const r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){$('amsg').textContent='⚠️ '+r.error.message;return}
  enter(r.data.user);
};
$('signup').onclick=async()=>{
  if(!sb){$('amsg').textContent='⚠️ No cargó Supabase. Revisa tu internet.';return}
  const r=await sb.auth.signUp({email:$('em').value.trim(),password:$('pw').value});
  if(r.error){$('amsg').textContent='⚠️ '+r.error.message;return}
  if(r.data.session)enter(r.data.user);
  else $('amsg').textContent='Revisa tu correo para confirmar la cuenta y luego toca Entrar.';
};
$('guest').onclick=()=>enter(null);
$('out').onclick=async()=>{await saveNow();if(sb&&user){try{await sb.auth.signOut()}catch(e){}}location.reload()};
if(sb)sb.auth.getSession().then(r=>{if(r.data&&r.data.session)enter(r.data.session.user)}).catch(()=>{});

/* ---------- aviso de nueva versión ---------- */
async function chkVer(){try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});const j=await r.json();if(j.version&&j.version!==VERSION)$('upd').style.display='block'}catch(e){}}
$('upd').onclick=()=>location.reload();
setInterval(chkVer,60000);chkVer();

/* ---------- bucle ---------- */
let last=performance.now(),walk=0,tick=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!started)return;
  S.t+=dt;
  const mag=Math.hypot(jx,jy);let moving=false;
  if(mag>.1){
    const f=-jy,rg=jx;
    const mx=Math.sin(camYaw)*f-Math.cos(camYaw)*rg,mz=Math.cos(camYaw)*f+Math.sin(camYaw)*rg;
    const l=Math.hypot(mx,mz)||1,sp=(5.5+Math.min(2,((S.st&&S.st.agi)||0)/250))*Math.min(1,mag);
    const nx=S.x+mx/l*sp*dt,nz=S.z+mz/l*sp*dt;
    if(Math.hypot(nx,nz)<R&&H(nx,nz)>-1.9){S.x=nx;S.z=nz;moving=true;dirty=true}
    player.rotation.y=Math.atan2(mx,mz);
  }
  if(moving)walk+=dt*10;
  const fire=nearFire();
  if(fire)S.hp=Math.min(100,S.hp+3*dt);
  else{S.hg=Math.max(0,S.hg-.2*dt);if(S.hg<=0)S.hp-=2*dt}
  if(S.hp<=0)die();
  player.position.set(S.x,H(S.x,S.z)+(moving?Math.abs(Math.sin(walk))*.12:0),S.z);
  const cd=9,cpx=S.x-Math.sin(camYaw)*Math.cos(pitch)*cd,cpz=S.z-Math.cos(camYaw)*Math.cos(pitch)*cd;
  cam.position.set(cpx,Math.max(H(cpx,cpz)+1,player.position.y+1.6+Math.sin(pitch)*cd),cpz);
  cam.lookAt(S.x,player.position.y+1.3,S.z);
  fireGroups.forEach((g,i)=>{g.children[0].scale.y=1+Math.sin(now/90+i)*.12;g.children[1].scale.y=1+Math.cos(now/70+i)*.15});
  tick+=dt;
  if(tick>.5){
    tick=0;hud();updSky();
    const o=nearest();$('grab').textContent='✋ Recolectar'+(o?' '+({T:'🌲',R:'🪨',B:'🫐'})[o.type]:'');
  }
  if(window.updEnemies)updEnemies(dt,now);
  if(window.updVisuals)updVisuals(dt,now);
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
