name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - capacitor.config.json
      - package.json
      - 'www/**'
      - .github/workflows/apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Poner el ícono
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Isekai-Online.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: Isekai-Online.apk
          make_latest: true
